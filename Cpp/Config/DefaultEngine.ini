[/Script/EngineSettings.GameMapsSettings]
; The game needs no level content: AUnitySpaceAppActor (spawned by Bootstrap) builds everything at runtime.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/UnrealSpaceGod.SpaceGameMode
GlobalDefaultServerGameMode=/Script/UnrealSpaceGod.SpaceGameMode

[/Script/Engine.Engine]
; Realistic scale draws Phobos about 11 uu across.
NearClipPlane=1.0

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
; US-T55: the original renders with URP's 4x MSAA (render.msaa on). Unreal's MSAA is the forward renderer's; every
; SpaceGodRender material is unlit and the game draws no engine lights, fog or GBuffer reads, so nothing needs deferred.
r.ForwardShading=True
r.AntiAliasingMethod=3
r.MSAACount=4
