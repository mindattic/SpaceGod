[/Script/EngineSettings.GameMapsSettings]
; The game needs no level content: AUnitySpaceAppActor (spawned by Bootstrap) builds everything at runtime.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/UnrealSpaceGod.SpaceGameMode
GlobalDefaultServerGameMode=/Script/UnrealSpaceGod.SpaceGameMode

; US-T64: co-op's resync is the host's save (4-5 MB) over reliable RPCs. At Unreal's default rates (about 100 KB/s a
; client) that takes most of a minute, and a client then has more than CoopPeer::MaxBacklog frames waiting and asks
; for another. tools/play.ps1 raised them with -ini: on the command line, which a Shipping build ignores
; (ALLOW_INI_OVERRIDE_FROM_COMMANDLINE), so they are here; nothing but a net game uses them.
[/Script/Engine.Player]
ConfiguredInternetSpeed=100000000
ConfiguredLanSpeed=100000000

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=100000000
MaxInternetClientRate=100000000

[/Script/Engine.Engine]
; Realistic scale draws Phobos about 11 uu across.
NearClipPlane=1.0

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
; US-T55: the original renders with URP's 4x MSAA (render.msaa on). Unreal's MSAA is the forward renderer's; every
; SpaceGodRender material is unlit and the game draws no engine lights, fog or GBuffer reads, so nothing needs deferred.
r.ForwardShading=True
r.AntiAliasingMethod=3
r.MSAACount=4
